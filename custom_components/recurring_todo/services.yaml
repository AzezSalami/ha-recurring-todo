add_task:
  target:
    entity:
      integration: recurring_todo
      domain: todo
  fields:
    name:
      required: true
      example: Change water filter
      selector:
        text:
    frequency:
      required: true
      example: monthly
      selector:
        select:
          options: [daily, weekly, monthly]
          translation_key: frequency
    interval:
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    weekdays:
      example: [sat]
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
          translation_key: weekday
    day_of_month:
      example: 1
      selector:
        number:
          min: 1
          max: 31
          mode: box
    time:
      default: "09:00:00"
      selector:
        time:
    start_date:
      selector:
        date:
    description:
      selector:
        text:
    notify:
      default: true
      selector:
        boolean:
    notify_services:
      example: [notify.mobile_app_my_phone]
      selector:
        text:
          multiple: true
remove_task:
  target:
    entity:
      integration: recurring_todo
      domain: todo
  fields:
    name:
      required: true
      example: Change water filter
      selector:
        text:
run_task:
  target:
    entity:
      integration: recurring_todo
      domain: todo
  fields:
    name:
      required: true
      example: Change water filter
      selector:
        text:
